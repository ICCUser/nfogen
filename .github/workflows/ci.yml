name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Installer la dependance systeme (libmediainfo)
        run: sudo apt-get update && sudo apt-get install -y libmediainfo0v5

      - name: Installer nfogen (+ extras api et dev)
        run: pip install -e ".[api,dev]"

      - name: Lint (ruff)
        run: ruff check .

      - name: Tests
        run: pytest -q
