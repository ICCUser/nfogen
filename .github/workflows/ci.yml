name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Installer la dependance systeme (libmediainfo)
        run: sudo apt-get update && sudo apt-get install -y libmediainfo0v5

      - name: Installer nfogen (+ extras api et dev)
        run: pip install -e ".[api,dev]"

      - name: Lint (ruff)
        run: ruff check .

      - name: Tests
        run: pytest -q

  # Sans ce job, un changement qui casse le build ou le lint du frontend
  # (frontend/) passait inapercu jusqu'au deploiement : le job "test"
  # ci-dessus ne touche jamais a frontend/ (cf. audit du 2026-08-11).
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Installer les dependances (npm ci, reproductible via package-lock.json)
        run: npm ci

      - name: Lint (oxlint)
        run: npm run lint

      - name: Build (tsc -b && vite build)
        run: npm run build
