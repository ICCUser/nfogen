name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # Incident reel (2026-09-09) : "Process completed with exit code 100"
      # sur cette etape, identique et repete meme apres une pause + reessai
      # (donc pas un simple flake reseau) -- ubuntu-latest est passe a
      # Ubuntu 24.04, qui a renomme de nombreux paquets libXXXv5 en
      # libXXXv5t64 (transition ABI time64) ; libmediainfo0v5t64 en repli
      # si le nom d'origine est introuvable, jamais l'inverse (le nom
      # d'origine reste tente en premier, pour un runner qui n'aurait pas
      # encore bascule). N'affecte QUE ce runner CI -- le Dockerfile reel
      # (python:3.12-slim, Debian) n'est pas concerne par ce renommage
      # specifique a Ubuntu.
      - name: Installer la dependance systeme (libmediainfo)
        run: |
          sudo apt-get update
          sudo apt-get install -y libmediainfo0v5 || sudo apt-get install -y libmediainfo0v5t64

      # gapscan explicite (pas seulement api+dev) : les tests gapscan_*
      # passaient jusqu'ici par coincidence (dev depend aussi de httpx),
      # sans lien explicite avec l'extra qu'ils testent reellement --
      # trouve en audit (2026-08-27).
      - name: Installer nfogen (+ extras api, gapscan, automation et dev)
        run: pip install -e ".[api,gapscan,automation,dev]"

      - name: Lint (ruff)
        run: ruff check .

      - name: Tests
        run: pytest -q

  # Sans ce job, un changement qui casse le build ou le lint du frontend
  # (frontend/) passait inapercu jusqu'au deploiement : le job "test"
  # ci-dessus ne touche jamais a frontend/ (cf. audit du 2026-08-11).
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Installer les dependances (npm ci, reproductible via package-lock.json)
        run: npm ci

      - name: Lint (oxlint)
        run: npm run lint

      - name: Tests (vitest)
        run: npm run test

      - name: Build (tsc -b && vite build)
        run: npm run build
