[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nfogen"
version = "2.0.0"
description = "Generateur de fichiers NFO modulaire, base sur des profils (C411 par defaut)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "ICCUser" }]
keywords = ["nfo", "mediainfo", "tracker", "c411", "generator"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Multimedia",
    "Topic :: Utilities",
]
dependencies = [
    "pymediainfo>=6.1",   # extraction des metadonnees video (necessite libmediainfo)
    "mutagen>=1.47",      # extraction des metadonnees audio
    "jinja2>=3.1.6",      # >=3.1.6 : corrige des contournements du SandboxedEnvironment (render.py)
    "jsonschema>=4.0",    # validation des rules.json (profils livres et utilisateur)
    "google-re2>=1.1",    # execution des regex admin (rules.json) sans risque ReDoS (rules.py)
]

[project.urls]
Homepage = "https://github.com/ICCUser/nfogen"
Repository = "https://github.com/ICCUser/nfogen"
Issues = "https://github.com/ICCUser/nfogen/issues"

[project.optional-dependencies]
api = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "python-multipart>=0.0.9",  # upload de fichiers via HTTP
]
gapscan = [
    "httpx>=0.27",  # c411_client.py / sonarr_client.py / radarr_client.py (voir GAPSCAN.md)
]
automation = [
    "torf>=4.3.1",  # torrent_builder.py (voir AUTOMATION.md, sous-projet 2) -- extra separe de gapscan, pas necessaire pour la seule detection de gap
]

dev = ["pytest>=8.0", "ruff>=0.4", "httpx>=0.27"]

[project.scripts]
nfogen = "nfogen.cli:main"

[tool.setuptools]
packages = ["nfogen", "nfogen.profiles", "nfogen.profiles.c411"]

[tool.setuptools.package-data]
"nfogen" = ["rules.schema.json"]
"nfogen.profiles.c411" = ["rules.json", "templates/*.j2"]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I"]
